name: iosApp
options:
  bundleIdPrefix: net.quietflare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    JAVA_HOME_FOR_KMP: /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Cycluna
        # A storyboard, not the UILaunchScreen dictionary. That dictionary's UIImageName
        # rendered nothing at all (verified on device: brand background, no mark) and gives
        # no control over the mark's size or position. See LaunchScreen.storyboard.
        UILaunchStoryboardName: LaunchScreen
        # Encryption export compliance: asserts only standard/exempt crypto
        # (HTTPS + standard AES). Confirm this exemption before submission.
        ITSAppUsesNonExemptEncryption: false
        # Optional biometric app-lock (Me › Privacy).
        NSFaceIDUsageDescription: Cycluna uses Face ID to keep your cycle data private on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.quietflare.cycluna
        # Explicit so the About screen and App Store Connect read the same numbers.
        # Bump MARKETING_VERSION per release, CURRENT_PROJECT_VERSION per upload.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # KMP framework produced by the pre-build script below:
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build KMP Shared framework"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          JAVA_HOME="/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home" \
            ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # Unit tests for the app's own logic (reminder planning, cycle copy). The shared KMP core
  # has its own tests — run those with `./gradlew :shared:jvmTest`.
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.quietflare.cycluna.tests

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
