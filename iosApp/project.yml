name: iosApp
options:
  bundleIdPrefix: app.cycluna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    JAVA_HOME_FOR_KMP: /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Cycluna
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Encryption export compliance: asserts only standard/exempt crypto
        # (HTTPS + standard AES). Confirm this exemption before submission.
        ITSAppUsesNonExemptEncryption: false
        # Optional biometric app-lock (Me › Privacy).
        NSFaceIDUsageDescription: Cycluna uses Face ID to keep your cycle data private on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cycluna.iosApp
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # KMP framework produced by the pre-build script below:
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build KMP Shared framework"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          JAVA_HOME="/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home" \
            ./gradlew :shared:embedAndSignAppleFrameworkForXcode

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
