name: iosApp
options:
  bundleIdPrefix: net.quietflare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Fallback JDK for the KMP pre-build script when the environment supplies
    # none — i.e. Xcode GUI builds, which inherit no shell profile. CI runners
    # export their own JAVA_HOME and it wins; see the script below.
    JAVA_HOME_FOR_KMP: /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
    # Must stay NO. XcodeGen's setting presets default this to YES (Xcode's own
    # recommendation), but the pre-build script below runs Gradle, which reads
    # ~/.gradle and writes shared/build + the framework into the app bundle —
    # all outside the sandbox. `embedAndSignAppleFrameworkForXcode` detects the
    # sandbox and hard-fails with "User Script Sandboxing Enabled".
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Signing. Set here, not in Xcode's UI — the .xcodeproj is generated, so a
    # team picked in the UI is dropped by the next `xcodegen generate`.
    # A Team ID is not a secret (it ships inside every distributed app), so it
    # is fine in this public repo.
    DEVELOPMENT_TEAM: 5UL5N2DB4N
    CODE_SIGN_STYLE: Automatic

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Cycluna
        # A storyboard, not the UILaunchScreen dictionary. That dictionary's UIImageName
        # rendered nothing at all (verified on device: brand background, no mark) and gives
        # no control over the mark's size or position. See LaunchScreen.storyboard.
        UILaunchStoryboardName: LaunchScreen
        # Encryption export compliance: asserts only standard/exempt crypto
        # (HTTPS + standard AES). Confirm this exemption before submission.
        ITSAppUsesNonExemptEncryption: false
        # Optional biometric app-lock (Me › Privacy).
        NSFaceIDUsageDescription: Cycluna uses Face ID to keep your cycle data private on this device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.quietflare.cycluna
        # Explicit so the About screen and App Store Connect read the same numbers.
        # Bump MARKETING_VERSION per release, CURRENT_PROJECT_VERSION per upload.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # KMP framework produced by the pre-build script below:
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build KMP Shared framework"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          # Resolve a JDK 17 without hard-coding a machine-specific path:
          #   1. an inherited JAVA_HOME (CI runners set this)
          #   2. java_home -v 17 (any local JDK 17, wherever installed)
          #   3. JAVA_HOME_FOR_KMP from the build settings (Xcode GUI builds,
          #      which inherit no shell profile)
          if [ -z "${JAVA_HOME:-}" ]; then
            JAVA_HOME="$(/usr/libexec/java_home -v 17 2>/dev/null || echo "$JAVA_HOME_FOR_KMP")"
          fi
          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "error: no JDK 17 found. Install Temurin 17 or set JAVA_HOME." >&2
            exit 1
          fi
          export JAVA_HOME
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # Unit tests for the app's own logic (reminder planning, cycle copy). The shared KMP core
  # has its own tests — run those with `./gradlew :shared:jvmTest`.
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iosAppTests
    dependencies:
      - target: iosApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.quietflare.cycluna.tests

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppTests
